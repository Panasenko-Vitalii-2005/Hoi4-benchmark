name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest

    timeout-minutes: 20

    env:
      SOLUTION_PATH: HOI4Benchmark.sln
      APP_PROJECT_PATH: src/HOI4Benchmark.App/HOI4Benchmark.App.csproj
      PUBLISH_DIRECTORY: artifacts/publish/win-x64
      RUNTIME_IDENTIFIER: win-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Display .NET information
        shell: pwsh
        run: |
          dotnet --version
          dotnet --info

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION_PATH

      - name: Build solution
        shell: pwsh
        run: |
          dotnet build $env:SOLUTION_PATH `
            --configuration Release `
            --no-restore

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test $env:SOLUTION_PATH `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=release-test-results.trx" `
            --results-directory TestResults
      - name: Restore Windows x64 publish dependencies
        shell: pwsh
        run: |
          dotnet restore $env:APP_PROJECT_PATH `
            --runtime $env:RUNTIME_IDENTIFIER

      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT_PATH `
            --configuration Release `
            --runtime $env:RUNTIME_IDENTIFIER `
            --self-contained true `
            --output $env:PUBLISH_DIRECTORY `
            --no-restore `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Verify published application
        shell: pwsh
        run: |
          $executablePath = Join-Path `
            $env:PUBLISH_DIRECTORY `
            "HOI4Benchmark.App.exe"

          if (-not (Test-Path $executablePath)) {
              throw "Published executable was not found: $executablePath"
          }

          Write-Host "Published executable:"
          Get-Item $executablePath

          Write-Host "Published files:"
          Get-ChildItem `
            -Path $env:PUBLISH_DIRECTORY `
            -Recurse |
            Select-Object FullName, Length

      - name: Create release archive
        id: archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          if ([string]::IsNullOrWhiteSpace($version)) {
              $version = "manual-${{ github.run_number }}"
          }

          $archiveName = `
            "HOI4Benchmark-$version-win-x64.zip"

          $archivePath = Join-Path `
            "artifacts" `
            $archiveName

          if (Test-Path $archivePath) {
              Remove-Item $archivePath -Force
          }

          Compress-Archive `
            -Path "$env:PUBLISH_DIRECTORY\*" `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          "archive_name=$archiveName" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "archive_path=$archivePath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Created archive: $archivePath"

      - name: Generate SHA-256 checksum
        id: checksum
        shell: pwsh
        run: |
          $archivePath = `
            "${{ steps.archive.outputs.archive_path }}"

          $checksumPath = "$archivePath.sha256"

          $hash = Get-FileHash `
            -Path $archivePath `
            -Algorithm SHA256

          "$($hash.Hash)  ${{ steps.archive.outputs.archive_name }}" |
            Out-File `
              -FilePath $checksumPath `
              -Encoding ascii

          "checksum_path=$checksumPath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Get-Content $checksumPath

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOI4Benchmark-${{ github.ref_name }}-win-x64
          path: |
            ${{ steps.archive.outputs.archive_path }}
            ${{ steps.checksum.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create `
            "${{ github.ref_name }}" `
            "${{ steps.archive.outputs.archive_path }}" `
            "${{ steps.checksum.outputs.checksum_path }}" `
            --title "HOI4 Benchmark ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
